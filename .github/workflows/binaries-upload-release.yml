name: Binaries upload release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build without write or OIDC permissions; only the signing job below can
  # mint a Sigstore certificate for this workflow identity.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64, arm]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Build binaries
      env:
        GOARCH: ${{ matrix.arch }}
      run: |
        make build
        mv ./bin/whereabouts ./bin/whereabouts-${{ matrix.arch }}
        mv ./bin/whereabouts-operator ./bin/whereabouts-operator-${{ matrix.arch }}
        mv ./bin/install-cni ./bin/install-cni-${{ matrix.arch }}
        cd ./bin
        sha256sum whereabouts-${{ matrix.arch }} > whereabouts-${{ matrix.arch }}.sha256
        sha256sum whereabouts-operator-${{ matrix.arch }} > whereabouts-operator-${{ matrix.arch }}.sha256
        sha256sum install-cni-${{ matrix.arch }} > install-cni-${{ matrix.arch }}.sha256
    - name: Upload build output
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries-${{ matrix.arch }}
        path: |
          ./bin/*-${{ matrix.arch }}
          ./bin/*-${{ matrix.arch }}.sha256
        if-no-files-found: error
        retention-days: 1

  upload:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless cosign sign-blob
    strategy:
      matrix:
        arch: [amd64, arm64, arm]
    steps:
    - name: Download build output
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: binaries-${{ matrix.arch }}
        path: ./bin
    - name: Verify checksums
      run: |
        cd ./bin
        sha256sum -c ./*.sha256
    - name: Install Cosign
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
    - name: Sign binaries with Cosign (keyless)
      env:
        ARCH: ${{ matrix.arch }}
      run: |
        cd ./bin
        for f in "whereabouts-${ARCH}" "whereabouts-operator-${ARCH}" "install-cni-${ARCH}"; do
          cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
        done
    - name: Upload release binaries
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          ./bin/whereabouts-${{ matrix.arch }}
          ./bin/whereabouts-${{ matrix.arch }}.sha256
          ./bin/whereabouts-${{ matrix.arch }}.sigstore.json
          ./bin/whereabouts-operator-${{ matrix.arch }}
          ./bin/whereabouts-operator-${{ matrix.arch }}.sha256
          ./bin/whereabouts-operator-${{ matrix.arch }}.sigstore.json
          ./bin/install-cni-${{ matrix.arch }}
          ./bin/install-cni-${{ matrix.arch }}.sha256
          ./bin/install-cni-${{ matrix.arch }}.sigstore.json
        tag_name: ${{ github.ref_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-manifests:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Prepare manifests
      env:
        TAG: ${{ github.ref_name }}
      run: |
        bash hack/release/validate-tag.sh "${TAG}"
        mkdir -p ./manifests
        make kustomize
        bin/kustomize build config/default | \
          sed "s|ghcr.io/telekom/whereabouts:[^ \"]*|ghcr.io/telekom/whereabouts:${TAG}|g" \
          > ./manifests/install.yaml
        if grep -R 'ghcr.io/telekom/whereabouts:latest' ./manifests; then
          echo "release manifests must not reference :latest" >&2
          exit 1
        fi
        if ! grep -R "ghcr.io/telekom/whereabouts:${TAG}" ./manifests; then
          echo "release manifests did not reference ${TAG}" >&2
          exit 1
        fi
    - name: Upload install manifests
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          ./manifests/*.yaml
        tag_name: ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
