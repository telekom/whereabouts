name: "Push helm chart on release"

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

on:
  push:
    tags:
      - v*
jobs:
  test:
    name: Run tests before release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and Test
        run: make test

  package-and-push-helm-chart:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # image-push-release.yml runs as a separate workflow on the same tag, so
      # wait for its multi-arch index built from this commit and resolve the
      # index digest from the registry (a stale image under the tag is ignored).
      - name: wait for release image
        id: release-image
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash hack/release/wait-for-release-image.sh

      # Only pin an image that image-push-release.yml signed for this tag and
      # commit. Its Sign job runs after the manifest is pushed, so retry.
      # Transitional opt-out: set the repository variable
      # SKIP_RELEASE_IMAGE_SIGNATURE_CHECK=true (may be removed later).
      - name: verify release image signature
        if: ${{ vars.SKIP_RELEASE_IMAGE_SIGNATURE_CHECK != 'true' }}
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.release-image.outputs.digest }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/image-push-release.yml@${{ github.ref }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            if cosign verify \
                --certificate-identity "${SIGNER_IDENTITY}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                --certificate-github-workflow-sha "${EXPECTED_REVISION}" \
                "${IMAGE_REF}" >/dev/null; then
              echo "verified signature on ${IMAGE_REF}"
              exit 0
            fi
            echo "attempt ${attempt}: no valid signature on ${IMAGE_REF} yet"
            sleep 15
          done
          echo "release image ${IMAGE_REF} is not signed by ${SIGNER_IDENTITY}" >&2
          exit 1

      - name: update chart
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_DIGEST: ${{ steps.release-image.outputs.digest }}
        run: make chart-prepare-release

      - name: lint release chart
        run: helm lint deployment/whereabouts-chart

      - name: template release chart
        env:
          IMAGE_DIGEST: ${{ steps.release-image.outputs.digest }}
        run: |
          helm template whereabouts deployment/whereabouts-chart > "${RUNNER_TEMP}/rendered.yaml"
          if ! grep -qF "${IMAGE_NAME}@${IMAGE_DIGEST}" "${RUNNER_TEMP}/rendered.yaml"; then
            echo "release chart does not reference ${IMAGE_NAME}@${IMAGE_DIGEST}" >&2
            exit 1
          fi

      - name: push chart
        id: push-chart
        env:
          GITHUB_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
        run: make chart-push-release

      - name: Sign chart with Cosign (keyless)
        run: cosign sign --yes "${{ steps.push-chart.outputs.chart_ref }}@${{ steps.push-chart.outputs.chart_digest }}"

      - name: Attest chart build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push-chart.outputs.chart_ref }}
          subject-digest: ${{ steps.push-chart.outputs.chart_digest }}
          push-to-registry: true
