apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "whereabouts.fullname" . }}
  {{- include "whereabouts.namespace" . | nindent 2 }}
  labels:
    {{- include "whereabouts.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      name: whereabouts
      {{- include "whereabouts.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.updateStrategy }}
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        name: whereabouts
        {{- include "whereabouts.selectorLabels" . | nindent 8 }}
    spec:
      hostNetwork: true
      serviceAccountName: {{ include "whereabouts.serviceAccountName" . }}
      {{- $cniBinDir := printf "/host%s" .Values.cniConf.binDir }}
      {{- $cniConfDir := printf "/host%s" .Values.cniConf.confDir }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- $securityContext := deepCopy (.Values.securityContext | default dict) }}
          {{- if .Values.cniPrivileged }}
          {{- $securityContext = dict "privileged" true "runAsUser" 0 }}
          {{- end }}
          {{- if .Values.seLinuxSpcT }}
          {{- $seLinuxOptions := $securityContext.seLinuxOptions | default dict }}
          {{- $_ := set $seLinuxOptions "type" "spc_t" }}
          {{- $_ := set $securityContext "seLinuxOptions" $seLinuxOptions }}
          {{- end }}
          securityContext:
            {{- toYaml $securityContext | nindent 12 }}
          image: {{ include "whereabouts.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/install-cni"]
          env:
          - name: NODENAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: spec.nodeName
          - name: WHEREABOUTS_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CNI_BIN_DIR
            value: {{ $cniBinDir | quote }}
          - name: CNI_CONF_DIR
            value: {{ $cniConfDir | quote }}
          {{- /* dig: nil-safe for --reuse-values from charts without these values.
                 Defaults (info, json) are not rendered, so upgrades keep the pod spec. */}}
          {{- $installCNI := .Values.installCNI | default dict }}
          {{- with (dig "logLevel" "info" $installCNI) }}{{ if ne . "info" }}
          - name: LOG_LEVEL
            value: {{ . | quote }}
          {{- end }}{{ end }}
          {{- with (dig "logFormat" "json" $installCNI) }}{{ if ne . "json" }}
          - name: LOG_FORMAT
            value: {{ . | quote }}
          {{- end }}{{ end }}
          {{- with (dig "logLevel" "" .Values.cniConf) }}
          - name: CNI_LOG_LEVEL
            value: {{ . | quote }}
          {{- end }}
          {{- with (dig "logFile" "" .Values.cniConf) }}
          - name: CNI_LOG_FILE
            value: {{ . | quote }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
          - name: cnibin
            mountPath: {{ $cniBinDir | quote }}
          - name: cni-net-dir
            mountPath: {{ $cniConfDir | quote }}
      volumes:
        - name: cnibin
          hostPath:
            path: {{ .Values.cniConf.binDir | quote }}
        - name: cni-net-dir
          hostPath:
            path: {{ .Values.cniConf.confDir | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
