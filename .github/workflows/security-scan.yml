name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 1 * * 1' # runs at 01:30 UTC every Monday
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reporter-tests:
    name: Security report tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test .github/scripts/security-report.test.cjs

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        continue-on-error: true
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        id: scan
        continue-on-error: true
        run: govulncheck ./...
      - name: Report scan status
        if: always() && steps.scan.outcome != 'success'
        run: echo '::warning title=Security scan advisory::govulncheck reported findings or could not complete. See the scan logs.'

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy filesystem scan
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Report scan status
        if: always() && steps.scan.outcome != 'success'
        run: echo '::warning title=Security scan advisory::Trivy reported findings or could not complete. See the scan logs.'

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard results
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        id: scan
        continue-on-error: true
      - name: Report scan status
        if: always() && steps.scan.outcome != 'success'
        run: echo '::warning title=Security scan advisory::Dependency review reported findings or could not complete. See the scan logs.'

  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize vendored README wording for REUSE parser
        run: |
          perl -pi -e 's/SPDX-License-Identifier\x3a Apache-2.0/Apache-2.0 license/g' vendor/github.com/go-openapi/jsonpointer/README.md
          perl -pi -e 's/SPDX-License-Identifier\x3a Apache-2.0/Apache-2.0 license/g' vendor/github.com/go-openapi/jsonreference/README.md
          perl -pi -e 's/SPDX-License-Identifier\x3a Apache-2.0/Apache-2.0 license/g' vendor/github.com/go-openapi/swag/README.md
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  license-audit:
    name: License Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        # renovate: datasource=go depName=github.com/google/go-licenses
        run: go install github.com/google/go-licenses@v1.6.0
      - name: Check licenses
        run: go-licenses check ./... --disallowed_types=forbidden,restricted
      - name: Generate license report
        run: go-licenses report ./... 2>/dev/null > licenses.csv || true
      - name: Upload license report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: license-report
          path: licenses.csv
          retention-days: 30
