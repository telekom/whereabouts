name: Image build
on: [pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Scan Image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          file: Dockerfile

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true # CVE-2026-39822 in golang base image, fixed by #316 (golang 1.26.5 bump)
        with:
          image-ref: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
