---
version: 2
updates:
  # Build tools pinned via tool directives (Makefile and security scan).
  # go-licenses has its own module: its old genproto requirement makes the
  # shared graph ambiguous for controller-gen.
  - package-ecosystem: gomod
    directories:
      - /hack/gotools
      - /hack/gotools/go-licenses
    allow:
      - dependency-name: github.com/google/go-licenses
      - dependency-name: github.com/mikefarah/yq/v4
      - dependency-name: golang.org/x/vuln
      - dependency-name: honnef.co/go/tools
      - dependency-name: sigs.k8s.io/controller-tools
      - dependency-name: sigs.k8s.io/kustomize/kustomize/v5
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 20
    groups:
      # One PR across both tool modules.
      go-tools:
        patterns: [ "*" ]
      # Dependabot has raised security updates for modules in these graphs
      # that `allow` does not list (x/crypto and x/net in go-licenses: #492,
      # #493). Collect them in one PR instead of one per dependency.
      go-tools-security:
        applies-to: security-updates
        patterns: [ "*" ]
    labels:
      - "dependencies"
      - "go"
  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-type: all
    cooldown:
      default-days: 3
      semver-major-days: 14
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      k8s:
        patterns: [ "k8s.io/*", "sigs.k8s.io/*" ]
        update-types: [ "major", "minor", "patch" ]
      containernetworking:
        patterns: [ "github.com/containernetworking/*" ]
      other-go-modules:
        patterns: [ "*" ]
        exclude-patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
          - "github.com/containernetworking/*"
      go-security:
        applies-to: security-updates
        patterns: [ "*" ]
    labels:
      - "dependencies"
      - "go"
  - package-ecosystem: docker
    directories:
      - /
      - /hack
      - /yamls
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      docker-major:
        group-by: dependency-name
        patterns: [ "*" ]
        update-types: [ "major" ]
      docker-minor-patch:
        group-by: dependency-name
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      # Digest-only updates have no SemVer increase. Group what the version
      # groups leave over, per image across all configured directories.
      docker-digests:
        group-by: dependency-name
        patterns: [ "*" ]
    labels:
      - "dependencies"
      - "docker"
  - package-ecosystem: helm
    directory: /deployment/whereabouts-chart
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: ghcr.io/telekom/whereabouts
    labels:
      - "dependencies"
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 20
    groups:
      actions-major:
        patterns: [ "*" ]
        update-types: [ "major" ]
      actions-minor-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
    labels:
      - "dependencies"
      - "ci"
