apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-deployment
  labels:
    app: scale-deployment
spec:
  replicas: 10 #use this to modify the number of pods spun up by the scale-test script 
  selector:
    matchLabels:
      app: scale-pod
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: whereabouts-scale
      labels:
        app: scale-pod
    spec:
      containers:
      - name: scale
        image: nicolaka/netshoot:v0.16@sha256:b09d9b21381f47a79b3cbcb30da25266dc17186ea00ae65e99fdc51396f48e70
        command:
          - sleep
          - "3600"
        imagePullPolicy: IfNotPresent