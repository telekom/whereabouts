# Default values for whereabouts.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/telekom/whereabouts
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: v0.0.7

updateStrategy: RollingUpdate
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
namespaceOverride: "kube-system"
successfulJobsHistoryLimit: 0

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  #name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

# Security context of the CNI install DaemonSet container. The installer only
# copies the whereabouts binary into cniConf.binDir and writes its kubeconfig and
# config into cniConf.confDir. It runs as root (UID 0) solely because those host
# directories are root-owned; it needs no Linux capabilities, no privilege
# escalation and no writable root filesystem (temp files are created next to
# their targets on the hostPath mounts). Keep in sync with
# config/daemonset/daemonset.yaml.
securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  runAsUser: 0
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# Set to true on hosts with SELinux in enforcing mode. Adds
# seLinuxOptions.type=spc_t to the CNI DaemonSet container so it may write the
# host CNI directories (labelled e.g. etc_t/bin_t), which the default
# container_t domain cannot. Previously this came implicitly with
# privileged: true.
seLinuxSpcT: false

resources:
  requests:
    cpu: "100m"
    memory: "50Mi"
  limits:
    cpu: "100m"
    memory: "50Mi"

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - operator: Exists
    effect: NoSchedule

affinity: {}

priorityClassName: ""

cniConf:
  confDir: /etc/cni/net.d
  binDir: /opt/cni/bin

operator:
  enabled: true
  replicas: 2
  # Service CIDR ranges used by the operator to warn on IPPool collisions.
  serviceCIDRs: []
  # Optional operator-specific scheduling constraints.
  # If empty, the chart falls back to top-level nodeSelector/tolerations.
  nodeSelector: {}
  tolerations: []
  priorityClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # topologySpreadConstraints for HA zone distribution (optional)
  # Example:
  # topologySpreadConstraints:
  # - maxSkew: 1
  #   topologyKey: topology.kubernetes.io/zone
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app: whereabouts-operator
  topologySpreadConstraints: []

webhook:
  # failurePolicy for the ValidatingWebhookConfiguration (Fail or Ignore).
  failurePolicy: Ignore
